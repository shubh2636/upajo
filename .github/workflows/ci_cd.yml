name: Upajo CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ==============================================================================
  # 1. Quality, Analysis & Security Verification
  # ==============================================================================
  lint_and_security:
    name: Static Analysis & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python ML Dependencies
        run: |
          pip install --upgrade pip
          pip install -r ml_service/requirements.txt pytest httpx

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze

  # ==============================================================================
  # 2. Automated Test Execution (Flutter, Backend, ML, Admin Web)
  # ==============================================================================
  test_suite:
    name: Run Automated Tests
    needs: lint_and_security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          flutter pub get
          pip install -r ml_service/requirements.txt requests pytest httpx
          cd admin_web && npm install && cd ..

      - name: Run Flutter Unit & Widget Tests
        run: flutter test test/

      - name: Run Comprehensive System & Agronomy Tests
        run: python test_parts_0_to_2.py

      - name: Run Backend Security Tests
        run: python -m pytest test_step6_backend_security.py

      - name: Run ML & Feedback Retraining Tests
        run: python -m unittest test_step7_ml_and_feedback.py

      - name: Run Database & RLS Security Validation
        run: python supabase/tests/run_rls_security_validation.py

      - name: Build Next.js Admin Web Portal
        run: |
          cd admin_web
          npm run build

  # ==============================================================================
  # 3. Build Production Android App Bundle (.aab)
  # ==============================================================================
  build_release:
    name: Build Android AppBundle (Prod)
    needs: test_suite
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        if: ${{ secrets.KEY_ALIAS != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle (Release Flavor: prod)
        run: flutter build appbundle --release --flavor prod

      - name: Upload Signed AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upajo-prod-release-aab
          path: build/app/outputs/bundle/prodRelease/*.aab
          retention-days: 14

  # ==============================================================================
  # 4. Deploy Supabase Backend & Edge Functions
  # ==============================================================================
  deploy_backend:
    name: Deploy Supabase Edge Functions & Migrations
    needs: test_suite
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Database Migrations to Supabase Prod
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $PROJECT_ID
          supabase db push

      - name: Deploy Edge Functions
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy create-razorpay-order --project-ref $PROJECT_ID
          supabase functions deploy verify-razorpay-payment --project-ref $PROJECT_ID
          supabase functions deploy send-push-notification --project-ref $PROJECT_ID
