name: upajo
description: "Upajo (उपजो) - Production Direct Farmer-to-Consumer Marketplace and AI Farming Assistant."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Internationalization
  easy_localization: ^3.0.7
  intl: ^0.20.3

  # Backend & Network
  supabase_flutter: ^2.5.6
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.0

  # Offline Cache & Sync Database
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0

  # Payments
  razorpay_flutter: ^1.3.7

  # Cloud Messaging & Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

  # Speech & Voice AI
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Media & ML Inference
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  tflite_flutter: ^0.10.4

  # UI Enhancements & Icons
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # Analytics Charts & PDF Invoicing (Part 5)
  fl_chart: ^0.68.0
  pdf: ^3.11.0
  printing: ^5.13.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.2.0
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.example
    - assets/translations/
    - assets/icons/
    - assets/images/
    - assets/models/
    - assets/fonts/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

