allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinTask ->
        def javaTask = tasks.findByName(kotlinTask.name.replace("Kotlin", "JavaWithJavac"))
        if (javaTask != null && javaTask.hasProperty("targetCompatibility")) {
            kotlinTask.kotlinOptions.jvmTarget = javaTask.targetCompatibility
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

