<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B492C"/>
      <stop offset="100%" stop-color="#25603A"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25603A"/>
      <stop offset="100%" stop-color="#3FA65B"/>
    </linearGradient>
  </defs>

  <!-- Fertile Soil Furrow Wave 1 (Base) -->
  <path d="M 64 420 C 140 450, 372 450, 448 420" fill="none" stroke="#6E5F44" stroke-width="20" stroke-linecap="round"/>

  <!-- Fertile Soil Furrow Wave 2 (Middle) -->
  <path d="M 112 370 C 180 395, 332 395, 400 370" fill="none" stroke="#9E8D6E" stroke-width="18" stroke-linecap="round"/>

  <!-- Fertile Soil Furrow Wave 3 (Top Ridge) -->
  <path d="M 160 320 C 205 340, 307 340, 352 320" fill="none" stroke="#D8972C" stroke-width="16" stroke-linecap="round"/>

  <!-- Central Growing Stem -->
  <path d="M 256 360 C 254 280, 258 200, 256 120" fill="none" stroke="url(#sproutGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Left Sprout Leaf -->
  <path d="M 256 240 C 150 220, 110 140, 170 100 C 230 110, 245 170, 256 240 Z" fill="url(#leafGrad)"/>

  <!-- Right Sprout Leaf (Fresh Shoot) -->
  <path d="M 256 190 C 350 170, 380 90, 320 60 C 270 70, 260 130, 256 190 Z" fill="#25603A"/>

  <!-- Center Golden Seed Heart -->
  <circle cx="256" cy="330" r="14" fill="#D8972C"/>
</svg>

