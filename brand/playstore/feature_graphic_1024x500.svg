<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF7F0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Field Furrow Landscape Wave Lines -->
  <path d="M -50 420 C 200 480, 800 420, 1100 470" fill="none" stroke="#E2D7C3" stroke-width="6"/>
  <path d="M -50 450 C 300 500, 750 440, 1100 490" fill="none" stroke="#D8972C" stroke-width="4" opacity="0.4"/>

  <!-- Left: Hero Brand Mark -->
  <g transform="translate(60, 80)">
    <!-- Soil Furrows -->
    <path d="M 40 320 C 90 345, 230 345, 280 320" fill="none" stroke="#6E5F44" stroke-width="16" stroke-linecap="round"/>
    <path d="M 70 280 C 110 300, 210 300, 250 280" fill="none" stroke="#9E8D6E" stroke-width="14" stroke-linecap="round"/>
    <path d="M 100 240 C 130 255, 190 255, 220 240" fill="none" stroke="#D8972C" stroke-width="12" stroke-linecap="round"/>

    <!-- Stem -->
    <path d="M 160 270 C 158 200, 162 130, 160 70" fill="none" stroke="#1B492C" stroke-width="20" stroke-linecap="round"/>

    <!-- Leaves -->
    <path d="M 160 170 C 85 155, 55 95, 100 65 C 145 72, 155 115, 160 170 Z" fill="#3FA65B"/>
    <path d="M 160 130 C 230 115, 250 55, 205 35 C 170 42, 163 85, 160 130 Z" fill="#25603A"/>
    <circle cx="160" cy="245" r="12" fill="#D8972C"/>
  </g>

  <!-- Center/Right: Brand Typography & Tagline -->
  <g transform="translate(420, 80)">
    <text x="0" y="90" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="92" font-weight="900" fill="#2E1F14" letter-spacing="-1">Upajo</text>
    <text x="270" y="85" font-family="'Noto Sans Devanagari', sans-serif" font-size="52" font-weight="800" fill="#25603A">उपजो</text>

    <text x="2" y="145" font-family="'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="700" fill="#25603A">सीधे खेत से घर तक — 100% शुद्ध एवं पारदर्शी</text>
    <text x="2" y="180" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="18" font-weight="500" fill="#6E5F44">DIRECT FARM-TO-FORK DIGITAL ECOSYSTEM</text>

    <!-- 3 Value Proposition Pills -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="48" rx="24" fill="#FFFFFF" stroke="#E2D7C3" stroke-width="1.5"/>
      <text x="82" y="30" font-family="'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="700" fill="#25603A" text-anchor="middle">0% दलाली</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="180" height="48" rx="24" fill="#FFFFFF" stroke="#E2D7C3" stroke-width="1.5"/>
      <text x="270" y="30" font-family="'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="700" fill="#D8972C" text-anchor="middle">लाइव मंडी भाव</text>

      <!-- Pill 3 -->
      <rect x="375" y="0" width="175" height="48" rx="24" fill="#FFFFFF" stroke="#E2D7C3" stroke-width="1.5"/>
      <text x="462" y="30" font-family="'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="700" fill="#1B492C" text-anchor="middle">तुरंत UPI भुगतान</text>
    </g>
  </g>
</svg>

