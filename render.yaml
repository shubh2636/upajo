services:
  # Upajo FastAPI ML & AI Microservice on Render (Production Paid Tier - Zero Spin-Down)
  - type: web
    name: upajo-ml-service
    env: python
    region: singapore # Closest low-latency region to Central/North India (MP/UP/Maharashtra)
    plan: starter # Paid tier ensures continuous 24x7 availability without cold start latency
    buildCommand: "pip install -r ml_service/requirements.txt"
    startCommand: "cd ml_service && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ML_SERVICE_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard secrets
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
